<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connection Lost - RecipeHub</title>

    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#d84315">
</head>

<body class="offline-body">

    <div class="offline-card">
        <div class="offline-icon">&#128245;</div>

        <h1>Connection Lost</h1>

        <p class="offline-message">
            Looks like your internet is not available right now.
            Please check your network and try again.
        </p>

        <p class="offline-hint">
            Your saved recipes are still available on this device,
            we will be back as soon as you reconnect.
        </p>

        <button type="button" onclick="location.reload()">Retry Connection</button>
    </div>

</body>
</html>
